<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="Reg.css">
  </head>
  <body>
    <section class="container">
      <header>Registration Form</header>
      <form action="#" class="form" id="Regform">
        <div class="input-box">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter full name"
                 autocomplete="name" required />
        </div>
        <div class="input-box">
          <label for="username">Email Address</label>
          <input type="email" id="username" placeholder="Enter email address"
                 autocomplete="email" required />
        </div>
        <div class="column">
          <div class="input-box">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters"
                   autocomplete="new-password" minlength="6" required />
          </div>
          <div class="input-box">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password"
                   autocomplete="new-password" minlength="6" required />
          </div>
        </div>
        <div class="column">
          <div class="input-box">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter phone number"
                   autocomplete="tel" required />
          </div>
          <div class="input-box">
            <label for="birthdate">Birth Date</label>
            <input type="date" id="birthdate" required />
          </div>
        </div>
        <div class="gender-box">
          <h3>Gender</h3>
          <div class="gender-option">
            <div class="gender">
              <input type="radio" id="check-male" name="gender" value="Male" checked />
              <label for="check-male">Male</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-female" name="gender" value="Female" />
              <label for="check-female">Female</label>
            </div>
            <div class="gender">
              <input type="radio" id="check-other" name="gender" value="Prefer not to say" />
              <label for="check-other">Prefer not to say</label>
            </div>
          </div>
        </div>
        <div class="input-box address">
          <label for="address">Address</label>
          <input type="text" id="address" placeholder="Enter street address"
                 autocomplete="street-address" required />
          <div class="column">
            <div class="select-box">
              <select id="country" required>
                <option hidden value="">Country</option>
                <option value="India">India</option>
                <option value="China">China</option>
                <option value="United States">United States</option>
                <option value="Indonesia">Indonesia</option>
                <option value="Pakistan">Pakistan</option>
                <option value="Brazil">Brazil</option>
                <option value="Nigeria">Nigeria</option>
                <option value="Bangladesh">Bangladesh</option>
                <option value="Russia">Russia</option>
                <option value="Mexico">Mexico</option>
                <option value="Japan">Japan</option>
                <option value="Ethiopia">Ethiopia</option>
                <option value="Philippines">Philippines</option>
                <option value="Egypt">Egypt</option>
                <option value="Vietnam">Vietnam</option>
                <option value="DR Congo">DR Congo</option>
                <option value="Turkey">Turkey</option>
                <option value="Iran">Iran</option>
                <option value="Germany">Germany</option>
                <option value="Thailand">Thailand</option>
              </select>
            </div>
            <input type="text" id="city" placeholder="Enter your city" required />
          </div>
          <div class="column">
            <input type="text" id="region" placeholder="Enter your region" required />
            <input type="text" id="postalcode" placeholder="Enter postal code"
                   inputmode="numeric" required />
          </div>
        </div>

        <p id="errorMessage" class="error-message" role="alert" hidden></p>

        <button type="submit">Submit</button>

        <div class="separator">
          <span>Already have an account? <a href="LogIn.html">Sign In</a></span>
        </div>
      </form>
    </section>
    <script type="module" src="Reg.js"></script>
  </body>
</html>
